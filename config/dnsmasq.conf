# Set listening interface
interface=wlp0s20f3
# Forces dnsmasq to bind strictly to the specified interface
bind-interfaces
# Define Dynamic IP range from 192.168.50.10 to 192.168.50.100, subnet /24, valid for 12 hours
dhcp-range=192.168.50.10,192.168.50.100,255.255.255.0,12h
# Router / Default Gateway to 192.168.50.1
dhcp-option=3,192.168.50.1
# DNS Servers to 192.168.50.1
dhcp-option=6,192.168.50.1
# Forwards uncached or external DNS queries to Google's DNS server
server=8.8.8.8
# Stores up to 1,000 DNS records in memory
cache-size=1000
# Logs every DNS query handled by dnsmasq
log-queries
# Reserves 192.168.50.11 and assigns hostname ClientA (38:68:93:37:85:ed = Brendan's laptop)
dhcp-host=38:68:93:37:85:ed,ClientA,192.168.50.11
# Reserves 192.168.50.12 and assigns hostname ClientB (10:63:c8:c1:5a:81 = Ahn's secondary Samsung laptop)
dhcp-host=10:63:c8:c1:5a:81,ClientB,192.168.50.12